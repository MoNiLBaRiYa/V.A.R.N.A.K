name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=varnak;user=sa;password=Secret123;encrypt=true;trustServerCertificate=true"
      AZURE_STORAGE_ACCOUNT_NAME: "devstoreaccount1"
      AZURE_STORAGE_ACCOUNT_KEY: "dummy-key"
      REDIS_URL: "redis://localhost:6379"
      ENTRA_TENANT_ID: "dummy-tenant"
      ENTRA_CLIENT_ID: "dummy-client"
      ENTRA_CLIENT_SECRET: "dummy-secret"
      NEXTAUTH_SECRET: "dummy-secret-longer-than-16-chars"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Lint Code
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm test

      - name: Build Next.js Application
        run: npm run build
