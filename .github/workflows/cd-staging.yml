name: CD Staging Deployment

on:
  push:
    branches: [main, master]

jobs:
  deploy-staging:
    name: Build & Deploy to Azure App Service (Staging Slot)
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application (Standalone)
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=varnak;user=sa;password=Secret123;encrypt=true;trustServerCertificate=true"
          AZURE_STORAGE_ACCOUNT_NAME: "devstoreaccount1"
          AZURE_STORAGE_ACCOUNT_KEY: "dummy-key"
          REDIS_URL: "redis://localhost:6379"
          ENTRA_TENANT_ID: "dummy-tenant"
          ENTRA_CLIENT_ID: "dummy-client"
          ENTRA_CLIENT_SECRET: "dummy-secret"
          NEXTAUTH_SECRET: "dummy-secret-longer-than-16-chars"
          NEXTAUTH_URL: "http://localhost:3000"
        run: npm run build

      - name: Deploy to Azure App Service Staging Slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'varnak-staging'
          slot-name: 'staging'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
